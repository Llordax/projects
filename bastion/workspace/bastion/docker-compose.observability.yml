services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    profiles:
      - observability
    ports:
      - "16686:16686"
    networks:
      - bastion

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles:
      - observability
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    networks:
      - bastion

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles:
      - observability
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bastion_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - bastion

  grafana:
    image: grafana/grafana:13.3.1
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bastion_grafana_local
    volumes:
      - bastion_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    networks:
      - bastion

volumes:
  bastion_prometheus_data:
  bastion_grafana_data: